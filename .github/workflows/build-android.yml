name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Tartib_frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          cd Tartib_frontend
          npm ci

      - name: Build React app
        run: |
          cd Tartib_frontend
          npm run build

      - name: Add Android platform
        run: |
          cd Tartib_frontend
          npx cap add android

      - name: Sync Capacitor
        run: |
          cd Tartib_frontend
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd Tartib_frontend/android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tartib-android-apk
          path: Tartib_frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
